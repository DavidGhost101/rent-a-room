name: Keep the site awake

# Render's free plan puts a service to sleep after 15 minutes without traffic.
# The next visitor then waits roughly 30 to 50 seconds while it wakes, which to
# someone browsing for a room looks like a broken site, and they leave.
#
# This pings /health every 10 minutes during waking hours so the service stays
# warm for real visitors.
#
# THE TRADEOFF, worth understanding before relying on this: Render's free plan
# gives 750 instance hours a month, which is roughly one service running
# continuously. Keeping this one awake consumes most of that allowance, so a
# second free service would compete with it. It also does nothing about the
# other free plan limits. The real fix is a paid instance or Cloud Run, and this
# is a stopgap that costs nothing.
#
# Runs 05:00 to 21:00 UTC, which is 07:00 to 23:00 in South Africa. Overnight it
# is allowed to sleep, since nobody is looking for a backroom at 3am and it saves
# the quota.

on:
  schedule:
    - cron: '*/10 5-21 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="https://rent-a-room-f0iy.onrender.com/health"
          # Generous timeout: if the service was already asleep this request is
          # the one that wakes it, and that takes time.
          CODE=$(curl -s -o /tmp/body.json -w '%{http_code}' --max-time 120 "$URL" || echo "000")
          echo "HTTP $CODE"
          cat /tmp/body.json || true
          echo ""
          if [ "$CODE" = "200" ]; then
            echo "Awake and healthy."
          elif [ "$CODE" = "503" ]; then
            # 503 is the app correctly reporting it is still connecting to MongoDB.
            # It woke up, which is the point of this job, so this is not a failure.
            echo "Woke up, still connecting to the database. Not a failure."
          else
            echo "::warning::Unexpected response $CODE from $URL"
          fi
