name: Build Android APK

# Builds the Rent A Room Android app (a Capacitor WebView shell around the
# same frontend the website uses) and uploads it as a downloadable artifact.
#
# This MUST run on GitHub's runners (or any CI with normal internet access) --
# it cannot be built inside a network-restricted sandbox, because the Android
# Gradle Plugin and all Android SDK components are fetched live from Google's
# and Maven Central's servers during the build.
#
# Before this produces a working app: edit android-app/www/config.js and
# replace the placeholder with your real deployed backend URL. The app has no
# backend of its own -- every screen calls whatever URL is in that file.

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8 CLI hard-requires Node >= 22. Node 20 fails the sync step.
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor (copies www/ into the native project)
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android-app/android
        # chmod because the repo was first committed from Windows, which does not
        # carry the executable bit. The bit is also set in git, this is a belt and braces.
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rent-a-room-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
